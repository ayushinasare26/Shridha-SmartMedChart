version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartmedchart_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-smartmed}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartmed123}
      POSTGRES_DB: ${DB_NAME:-smartmedchart}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-smartmed} -d ${DB_NAME:-smartmedchart}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
